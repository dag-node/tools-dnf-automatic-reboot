# /etc/dnf/plugins/needs-restarting.d/automatic-reboot.conf
#
# Packages added to the list `dnf needs-restarting -r` checks: an update to
# one of them reboots the host.  One package name per line.  The plugin's own
# list already holds the kernel, glibc, linux-firmware, systemd and dbus
# packages, so they need no entry here.
#
# The plugin reads every line as a package name, so the lines starting with
# `#` are removed when this file is installed.
audit

# dnf-automatic-reboot.conf
# Companion config to /etc/dnf/automatic.conf
# All options here control reboot/watchdog behaviour only.
# ---------------------------------------------------------------------------

[reboot]
# Seconds to wait after updates complete before rebooting.
# Allows time for any post-update services to settle and for admins
# to see the wall message before the system goes down.
# Default: 60
reboot_delay_sec = 60

# Schedule a reboot even when needs-restarting reports nothing needs it.
# Useful if you prefer a clean boot after every update cycle regardless.
# Valid values: yes / no
# Default: no
always_reboot = no

[timeouts]
# Hard wall-clock timeout (minutes) for dnf-automatic to complete.
# SIGTERM is sent at this point, then SIGKILL after kill_grace_sec.
# Should comfortably exceed your worst-case update time.
# Default: 60
dnf_timeout_min = 60

# Seconds between SIGTERM and SIGKILL when aborting a hung dnf-automatic.
# Default: 30
kill_grace_sec = 30

# Watchdog soft timeout (minutes).
# After this point the watchdog checks whether dnf is still active.
# If dnf is idle at soft timeout it acts based on the current phase.
# Must be <= watchdog_hard_timeout_min.
# Default: 60
watchdog_soft_timeout_min = 60

# Watchdog hard timeout (minutes).
# If the run.sh PID is still alive after this duration the watchdog
# kills the process tree and issues a forced reboot.
# Default: 180
watchdog_hard_timeout_min = 180

[false_positives]
# Comma-separated list of package name prefixes to strip from
# needs-restarting -r output before deciding a reboot is required.
#
# kernel-uek, kernel-uek-core:
#   Known aarch64 false positive. needs-restarting fails to normalise the
#   trailing .aarch64 arch suffix when comparing RPM EVR against uname -r.
#   needs-reboot.sh cross-verifies and reinstates the flag on genuine mismatch.
#
# systemd:
#   needs-restarting uses INSTALLTIME-vs-boot-time for systemd. If systemd
#   was updated during a previous boot cycle its INSTALLTIME remains newer
#   than all subsequent boot timestamps, causing a permanent false positive
#   even though the running binary is identical to the one on disk.
#   needs-reboot.sh cross-verifies via eu-readelf build-id comparison against
#   /proc/1/exe and reinstates the flag if build-ids differ (genuine update).
#   Requires elfutils package for eu-readelf.
#
# Default: kernel-uek,kernel-uek-core,systemd
filter_packages = kernel-uek,kernel-uek-core,systemd

# Attempt to cross-verify filtered kernel packages by comparing
# uname -r against the highest installed RPM version string.
# If they match the package is confirmed spurious and filtered.
# If they differ the real mismatch is kept and triggers a reboot.
# Valid values: yes / no
# Default: yes
verify_kernel_version = yes

[notifications]
# Send wall(1) messages to logged-in users at key events.
# Valid values: yes / no
# Default: yes
wall_messages = yes

# automatic-reboot.conf
# Companion config to /etc/dnf/automatic.conf
# All options here control reboot/watchdog behaviour only.
# ---------------------------------------------------------------------------

[reboot]
# Seconds to wait after updates complete before rebooting.
# Allows time for any post-update services to settle and for admins
# to see the wall message before the system goes down.
# Default: 60
reboot_delay_sec = 60

# Schedule a reboot even when needs-restarting reports nothing needs it.
# Useful if you prefer a clean boot after every update cycle regardless.
# Valid values: yes / no
# Default: no
always_reboot = no

[security]
# Report enabled repositories that carry an explicit gpgcheck=0, before any
# package is installed.  This service installs packages unattended, so an
# unsigned repository is a code path nobody is watching.  Reported, not fatal:
# a deliberate local unsigned repository is a valid choice, and refusing to
# patch the host is the worse outcome.
# Valid values: yes / no
# Default: yes
warn_unsigned_repositories = yes

# After each update, report security advisories that apply to this host but
# that dnf will not install.
#
# `dnf updateinfo` reads the whole package sack; the depsolver does not.  A
# repository priority=, an excludepkgs=, a disabled channel or a versionlock
# can leave an advisory permanently visible-but-unappliable, and the update run
# reports success either way - the host simply never gets the fix and nothing
# says so.  Repository priority is the common cause: dnf considers only the
# lowest-numbered repository that provides a package name at all, "possibly
# despite being a lower version" (dnf.conf(5)), so a priority= on a
# distribution channel silently pins every package that channel ships and masks
# errata from every other one.
#
# The check compares the advisories dnf itself reports as applicable against
# whether a security transaction resolves to anything, so it catches any cause
# without needing to know which.  Diagnose a report with:
#   dnf updateinfo list --updates --security
#   dnf --assumeno --setopt='*.priority=99' update --security
# Valid values: yes / no
# Default: yes
warn_unapplied_advisories = yes

[services]
# Restart systemd services whose running processes still map the pre-update
# copy of a file, as reported by `needs-restarting -s`.
#
# This closes the gap `needs-restarting -r` leaves open: -r only inspects a
# fixed list of ten package names (kernel*, glibc, systemd, dbus*,
# linux-firmware, microcode_ctl) plus drop-ins under
# /etc/dnf/plugins/needs-restarting.d/.  A security update to sshd, nginx,
# bind or anything linking a refreshed library patches the on-disk file and
# leaves the vulnerable code resident in memory with no reboot flag raised.
#
# Skipped entirely when a reboot is already scheduled - the reboot supersedes
# it.  Units are restarted with `systemctl try-restart`, so a unit that is not
# currently running is left alone.
# Valid values: yes / no
# Default: yes
restart_services = yes

# Units never restarted automatically, whatever needs-restarting reports.
# Entries are unit names or globs; user@*.service matches every instance.
# dbus/dbus-broker cannot be restarted on a running system without breaking
# every client that holds a bus connection; a systemd-logind restart drops
# session tracking; restarting user@*.service ends that user's services and
# sessions, and the getty/autovt instances log out their console;
# dnf-automatic-reboot and dnf-automatic-watchdog are this package's own
# units, and restarting them mid-run would stop the run.  Extend, do not
# shorten.
# Default: dbus.service,dbus-broker.service,systemd-logind.service,user@*.service,getty@*.service,serial-getty@*.service,autovt@*.service,dnf-automatic-reboot.service,dnf-automatic-watchdog.service
restart_services_exclude = dbus.service,dbus-broker.service,systemd-logind.service,user@*.service,getty@*.service,serial-getty@*.service,autovt@*.service,dnf-automatic-reboot.service,dnf-automatic-watchdog.service

[timeouts]
# Hard wall-clock timeout (minutes) for dnf-automatic to complete.
# SIGTERM is sent at this point, then SIGKILL after kill_grace_sec.
# Should comfortably exceed your worst-case update time.
# Default: 60
dnf_timeout_min = 60

# Seconds between SIGTERM and SIGKILL when aborting a hung dnf-automatic.
# Default: 30
kill_grace_sec = 30

# Wall-clock timeout (seconds) for a single needs-restarting invocation.
# needs-restarting activates a dnf sack and requests filelists metadata, so
# on a slow link a low value expires before it can answer.  Expiry is
# reported as a tool error (exit 2), which does NOT reboot - keep this
# generous rather than tight.
# Default: 120
needs_restarting_timeout_sec = 120

# Watchdog soft timeout (minutes).
# After this point the watchdog checks whether dnf is still active.
# If dnf is idle at soft timeout it acts based on the current phase.
# Must be <= watchdog_hard_timeout_min.
# Default: 60
watchdog_soft_timeout_min = 60

# Watchdog hard timeout (minutes).
# If the run.sh PID is still alive after this duration the watchdog kills the
# service cgroup.  Whether it then reboots depends on the recorded phase and
# on force_reboot_on_hard_timeout below.
# Default: 180
watchdog_hard_timeout_min = 180

# Reboot at hard timeout even when the recorded phase is `updating`.
#
# phase=updating means dnf-automatic had not returned, so an rpm transaction
# may be half-applied.  Killing it and rebooting can leave an inconsistent
# rpmdb or an unbootable system - the same uncertainty for which the watchdog
# already refuses to reboot after an unclean crash.  The default therefore
# kills the run, alerts, and leaves the host up for an operator.
#
# phase=checking is unaffected: dnf has already returned cleanly there, so a
# hard timeout in that phase always reboots.
# Valid values: yes / no
# Default: no
force_reboot_on_hard_timeout = no

[false_positives]
# Comma-separated list of packages to strip from needs-restarting -r output
# before deciding a reboot is required.  Each entry is cross-verified before
# being accepted as a false positive -- a genuine update re-adds the package
# and triggers a reboot.  A package that cannot be verified either way is
# treated as genuine, never as a false positive.
#
# ROOT CAUSE (all entries below share it).  `needs-restarting -r` performs
# exactly one test per package:  rpm INSTALLTIME > boot time.  It never
# compares version strings.  Its boot time comes from systemd's
# UnitsLoadStartTimestamp over D-Bus, falling back to max(mtime of /proc/1,
# btime in /proc/stat).  On a host without a working RTC (Raspberry Pi 4)
# that timestamp is captured before chrony steps the clock, so the recorded
# boot time is permanently in the past and every package on the list stays
# flagged forever.  Fitting an RTC removes the cause outright and makes this
# whole section unnecessary; the cross-checks below are the workaround for a
# host that has no RTC.
#
# kernel-uek, kernel-uek-core  (aarch64 / OL9 UEK)
# kernel, kernel-core           (x86_64 / RHEL 8 and 9)
#   Cross-verification: compare uname -r against the highest installed RPM
#   VERSION-RELEASE.ARCH.  Equal = the running kernel already is the newest
#   installed one = false positive.  Different = genuine.  Packages not
#   installed on the running system are skipped automatically, so it is safe
#   to list both UEK and standard kernel names in all configs.
#
# systemd:
#   Cross-verification: walk /proc/*/exe, find every process whose binary is
#   owned by the package via rpm -qf, compare ELF build-ids via eu-readelf.
#   All build-ids matching = false positive.  Any mismatch, or no owned
#   process at all = genuine.  Requires elfutils (hard RPM dependency).
#
# Default: kernel-uek,kernel-uek-core,kernel,kernel-core,systemd
filter_packages = kernel-uek,kernel-uek-core,kernel,kernel-core,systemd

# Attempt to cross-verify filtered kernel packages by comparing
# uname -r against the highest installed RPM version string.
# If they match the package is confirmed spurious and filtered.
# If they differ the real mismatch is kept and triggers a reboot.
# Valid values: yes / no
# Default: yes
verify_kernel_version = yes

# Learn false positives for any non-kernel package by observing whether it
# is still flagged by needs-restarting after a real reboot, proven by
# comparing kernel boot IDs rather than timestamps.  A package's learned
# state is keyed to its exact installed EVR, so a genuine future update on
# the same package always starts a fresh, unverified cycle rather than
# inheriting an old confirmation.  The first time a given package/EVR pair
# is flagged it still triggers one reboot; only reappearing at the same EVR
# after that reboot confirms it as a false positive and stops further
# reboots for it.  State is tracked in
# /var/lib/dnf-automatic-reboot/restart-state, not here - this key only
# toggles the mechanism on or off.
# Valid values: yes / no
# Default: yes
learn_false_positives = yes

[kernel]
# A kernel update is only applied by a reboot if kernel-install makes the new
# kernel the GRUB default.  The installer checks, and refuses without:
#   - GRUB_UPDATE_DEFAULT_KERNEL=true in /etc/default/grub
#   - DEFAULTKERNEL=<running kernel package> in /etc/sysconfig/kernel (EL9)
#   - the GRUB default already on the newest installed kernel
# It does not edit either file or change the default; it names what to set.

# Before rebooting for a kernel update, confirm `grubby --default-kernel`
# already points at the newest installed kernel.  If it does not, the reboot
# would come back up on the same kernel and be requested again on the next
# run - an unbounded reboot loop on a host whose saved_entry never advances.
# When the check fails the reboot is withheld and the condition is logged at
# error level for an operator.
# Valid values: yes / no
# Default: yes
verify_grub_default = yes

# Consecutive reboots this package will schedule for the same target kernel
# version before giving up and alerting instead.  Backstop for any cause of
# a kernel that never becomes the running one (GRUB fallback reverting
# saved_entry, a kernel that panics and falls back, a read-only /boot).
# The counter lives in /var/lib/dnf-automatic-reboot/kernel-reboot-attempts
# and resets as soon as the target kernel is observed running.
# Set to 0 to disable the cap.
# Default: 3
kernel_reboot_attempt_limit = 3

[time]
# Enable chrony-wait.service at install time, if the chrony package ships it.
#
# The service unit orders itself after time-sync.target so that rpm
# INSTALLTIME stamps and the boot-time comparison inside needs-restarting
# both see a correct clock.  On UEK R8 systemd-time-wait-sync.service is
# absent, and nothing else pulls in time-sync.target, so that ordering is
# satisfied trivially and means nothing.  chrony-wait.service (shipped by
# chrony, disabled by default) runs `chronyc waitsync` and is ordered
# Before=time-sync.target, which makes the gate real.
# Valid values: yes / no
# Default: yes
enable_chrony_wait = yes

[notifications]
# Send wall(1) messages to logged-in users at key events.
# Valid values: yes / no
# Default: yes
wall_messages = yes

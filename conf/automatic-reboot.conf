# automatic-reboot.conf
# Companion config to /etc/dnf/automatic.conf, whose [commands] section must
# set download_updates = yes, apply_updates = yes and reboot = never, with
# upgrade_type = default or security.  The defaults suit an unattended
# host, a Raspberry Pi without a battery-backed clock included; change a
# setting only for the reason its group names.  How each decision is made,
# and the fixed limits behind it: /usr/share/doc/dnf-automatic-reboot/README
#
# Every line is a comment, a [section] header, or key = value.  A # after a
# blank starts a comment.  Yes/no settings accept yes, true, on, 1 and no,
# false, off, 0 in any case.  Sections only group the keys; every key appears
# once in the file.  A key left out takes its default.
#
# Any other line, an unknown or repeated key, or a value outside its range
# stops every update run, and every reboot this package would request,
# until the file is fixed.  The run's failure notice names each line.  Check
# the file with: /usr/libexec/dnf-automatic-reboot/check-config.sh
# ---------------------------------------------------------------------------

[services]
# When an update does not need a reboot, restart the services still running
# code from files it replaced (needs-restarting -s), so a fix to sshd, nginx,
# or a library they load takes effect.  A restart that fails, or does not
# finish within service_restart_timeout_seconds, fails the run, naming the
# service.
#
# Exclude the services whose clients notice a restart and that you restart
# yourself in a maintenance window, such as a database or a host's container
# units: unit names or globs, each ending in .service, comma-separated.
# dbus, dbus-broker, systemd-logind, user@, getty@, serial-getty@, autovt@
# and this package's own units are never restarted, whatever the list holds.
# Each excluded service still running old code is named in the run's summary.
# Set restart_services = no only where you restart every service yourself.
#
#   restart_services                    yes / no          default yes
#   restart_services_excluded_patterns  unit names, globs default (empty)
#   service_restart_timeout_seconds     10 - 900          default 300
restart_services = yes
restart_services_excluded_patterns =
service_restart_timeout_seconds = 300

[network]
# Raise these on a slow link, such as a mobile or modem connection.  Each run
# first fetches current repository metadata, so an advisory published since
# the last run is installed by this one; on a slow link the full metadata of
# every repository takes long.  A refresh that runs out of time is logged,
# and the run installs from the metadata it has.  dnf_query_timeout_seconds
# bounds each dnf query of a run: the reboot check, the list of services to
# restart and the advisory report.  A reboot check that runs out of time does
# not reboot, and the run fails.
#
#   metadata_refresh_timeout_seconds  60 - 7200   default 1800
#   dnf_query_timeout_seconds         30 - 900    default 120
metadata_refresh_timeout_seconds = 1800
dnf_query_timeout_seconds = 120

[reports]
# Report, before anything is installed, every enabled repository with
# gpgcheck=0: this service installs from it unattended, without checking
# signatures.  After the update, report security advisories that apply to this
# host but that dnf will not install, usually because a repository priority=,
# an excludepkgs= or a versionlock hides the fix; without the report, every
# run succeeds while the host stays unpatched.  Diagnose that report with:
#   dnf updateinfo list --updates --security
#   dnf --assumeno --setopt='*.priority=99' update --security
# Turn a report off only for a deliberate unsigned repository or versionlock
# whose report you do not want at every run.
#
#   warn_unsigned_repositories  yes / no   default yes
#   warn_unapplied_advisories   yes / no   default yes
warn_unsigned_repositories = yes
warn_unapplied_advisories = yes

[time]
# Install nothing until chronyd confirms the clock is right, so package
# install times and the reboot check see the correct time; a host without a
# battery-backed clock boots with the wrong one.  A run whose clock is not
# confirmed within clock_sync_timeout_seconds fails.  Set require_clock_sync
# = no only on a host whose clock is kept by something other than chronyd.
#
#   require_clock_sync          yes / no      default yes
#   clock_sync_timeout_seconds  60 - 3600     default 600
require_clock_sync = yes
clock_sync_timeout_seconds = 600

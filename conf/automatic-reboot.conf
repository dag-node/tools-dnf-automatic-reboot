# automatic-reboot.conf
# Companion config to /etc/dnf/automatic.conf
# All options here control reboot/watchdog behaviour only.
# ---------------------------------------------------------------------------

[reboot]
# Seconds to wait after updates complete before rebooting.
# Allows time for any post-update services to settle and for admins
# to see the wall message before the system goes down.
# Default: 60
reboot_delay_sec = 60

# Schedule a reboot even when needs-restarting reports nothing needs it.
# Useful if you prefer a clean boot after every update cycle regardless.
# Valid values: yes / no
# Default: no
always_reboot = no

[timeouts]
# Hard wall-clock timeout (minutes) for dnf-automatic to complete.
# SIGTERM is sent at this point, then SIGKILL after kill_grace_sec.
# Should comfortably exceed your worst-case update time.
# Default: 60
dnf_timeout_min = 60

# Seconds between SIGTERM and SIGKILL when aborting a hung dnf-automatic.
# Default: 30
kill_grace_sec = 30

# Watchdog soft timeout (minutes).
# After this point the watchdog checks whether dnf is still active.
# If dnf is idle at soft timeout it acts based on the current phase.
# Must be <= watchdog_hard_timeout_min.
# Default: 60
watchdog_soft_timeout_min = 60

# Watchdog hard timeout (minutes).
# If the run.sh PID is still alive after this duration the watchdog
# kills the process tree and issues a forced reboot.
# Default: 180
watchdog_hard_timeout_min = 180

[false_positives]
# Comma-separated list of packages to strip from needs-restarting -r output
# before deciding a reboot is required.  Each entry is cross-verified before
# being accepted as a false positive -- a genuine update re-adds the package
# and triggers a reboot.
#
# kernel-uek, kernel-uek-core  (aarch64 / OL9 UEK)
# kernel, kernel-core           (x86_64 / RHEL 8 and 9)
#   needs-restarting fails to normalise the trailing .<arch> suffix when
#   comparing the RPM EVR string against uname -r, producing a permanent
#   false positive even after rebooting into the new kernel.
#   Cross-verification: strip .<arch> from the highest installed RPM EVR and
#   grep-F against uname -r.  Match = false positive.  Mismatch = genuine.
#   Packages not installed on the running system are skipped automatically,
#   so it is safe to list both UEK and standard kernel names in all configs.
#
# systemd:
#   needs-restarting uses INSTALLTIME-vs-boot-time for systemd.  If systemd
#   was updated during a previous boot cycle its INSTALLTIME remains newer
#   than all subsequent boot timestamps, causing a permanent false positive
#   even though the running binary is identical to the one on disk.
#   Cross-verification: walk /proc/*/exe, find a process owned by the package
#   via rpm -qf, compare ELF build-ids via eu-readelf.  Match = false positive.
#   Requires elfutils (hard RPM dependency).
#
# Default: kernel-uek,kernel-uek-core,kernel,kernel-core,systemd
filter_packages = kernel-uek,kernel-uek-core,kernel,kernel-core,systemd

# Attempt to cross-verify filtered kernel packages by comparing
# uname -r against the highest installed RPM version string.
# If they match the package is confirmed spurious and filtered.
# If they differ the real mismatch is kept and triggers a reboot.
# Valid values: yes / no
# Default: yes
verify_kernel_version = yes

# Learn false positives for any non-kernel package by observing whether it
# is still flagged by needs-restarting after a real reboot, proven by
# comparing kernel boot IDs rather than timestamps.  A package's learned
# state is keyed to its exact installed EVR, so a genuine future update on
# the same package always starts a fresh, unverified cycle rather than
# inheriting an old confirmation.  The first time a given package/EVR pair
# is flagged it still triggers one reboot; only reappearing at the same EVR
# after that reboot confirms it as a false positive and stops further
# reboots for it.  State is tracked in
# /var/lib/dnf-automatic-reboot/restart-state, not here - this key only
# toggles the mechanism on or off.
# Valid values: yes / no
# Default: yes
learn_false_positives = yes

[kernel]
# Manage the GRUB BLS default so a newly installed UEK kernel is the one
# selected at the next boot.  On OL9 UEK hosts kernel-install does not
# advance saved_entry by default (DEFAULTKERNEL and GRUB_UPDATE_DEFAULT_KERNEL
# are unset), so without this the system can reboot back into the previous
# kernel after an update.
#
# This is one-time provisioning, applied by the RPM %post scriptlet at install
# time (read from this file), not on every update.  When enabled and the
# package owning the running kernel matches kernel_default_package, %post:
#   - sets DEFAULTKERNEL in /etc/sysconfig/kernel
#   - sets GRUB_UPDATE_DEFAULT_KERNEL="true" in /etc/default/grub
#   - points the GRUB default at the newest installed kernel via grubby
#     (repairs any existing backlog)
#   - enables grub-boot-success.service, which marks each healthy boot
#     successful so GRUB's indeterminate-boot fallback cannot revert to an
#     old kernel
# Once set, kernel-install advances the default automatically on every future
# kernel update.  On any other host (e.g. x86_64 stock kernel) it is a no-op.
# Valid values: yes / no
# Default: yes
manage_kernel_default = yes

# Kernel package whose newest installed version should become the GRUB
# default.  Only hosts whose running kernel is owned by this package are
# affected; this keeps the logic scoped to UEK and never touches a non-UEK
# kernel.
# Default: kernel-uek-core
kernel_default_package = kernel-uek-core

[notifications]
# Send wall(1) messages to logged-in users at key events.
# Valid values: yes / no
# Default: yes
wall_messages = yes

# Create the runtime log and state directory with the intended ownership and
# mode before any script writes to them.  Without this the log is created by
# whichever script logs first, under the service umask, and ends up 0644.
# Type f/d also applies the SELinux label from the base policy (var_log_t,
# var_lib_t), so no custom fcontext is needed.
d /var/lib/dnf-automatic-reboot 0750 root root -
f /var/log/dnf-automatic-reboot.log 0640 root root -
# flock(2) locks through a read-only descriptor, so only root may open the
# reboot request lock.  The scripts also set this mode before every use.
f /run/dnf-automatic-reboot.reboot-request.lock 0600 root root -
